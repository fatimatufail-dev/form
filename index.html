<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form-learning</title>
</head>
<body>
    <style class="form-style">
        body {
            background-color: #e0ca81;
        }
        .form-container {
            background-color: rgb(250, 248, 239);
            padding: 40px;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(181, 120, 120, 0.919);
        }
    </style>
    <center><h1>Form to apply job</h1></center>
    <center>
    <form type="post" action="submit.php" class="form-container">
       <br>
         <label for="username">Name:</label>
       
         <input type="text" name="username" placeholder="Enter your name" required>
        <br>
         <br>
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
         <br>

        <div>
             <br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" value="male" required> Male           
            <input type="radio" name="gender" value="female" required> Female
             <br>
            </div>

            <div>
               <br>
                 <label for="country">Country:</label>
            <select name="country" required>
                <option value="">Select your country</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Australia">Australia</option>
                <option value="India">India</option>
                <option value="Pakistan">Pakistan</option>
            </select>
             <br>
            </div>
            <div>
             <br>
                <label for="message">Message:</label>
                <br>
                <textarea name="comment" placeholder="Enter your comment....." required></textarea>
                <br>
                <input type="submit" value="Submit">
                 <br>
            </div>
            </center>
    </form>
    
     

</body>     
</html>
